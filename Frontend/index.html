<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <base href="/Service-Planner/" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#0f172a" />

    <meta
      name="description"
      content="Service Planner - Plan Everything Smartly"
    />

    <title>Service Planner</title>

    <script>
      (() => {
        try {
          const THEME_KEY = "theme";
          const savedTheme = localStorage.getItem(THEME_KEY);

          const theme =
            savedTheme === "light" || savedTheme === "dark"
              ? savedTheme
              : "dark";

          const root = document.documentElement;

          root.classList.toggle("dark", theme === "dark");

          root.setAttribute("data-theme", theme);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <!-- Standard Desktop Browser Tabs (Low & High DPI) -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/Service-Planner/Service_Planner_Favicon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/Service-Planner/Service_Planner_Favicon.png"
    />

    <!-- iOS Home Screen & Apple Devices -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/Service-Planner/Service_Planner_Favicon.png"
    />

    <!-- Android & Mobile Web App Home Screen Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/Service-Planner/Service_Planner_Favicon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/Service-Planner/Service_Planner_Favicon.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
